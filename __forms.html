<!DOCTYPE html>
<!-- Netlify Forms detection only. Field names must match src/components/contact/BookingForm.tsx. -->
<html lang="sv">
  <body>
    <form name="bokning" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="bokning" />
      <input name="bot-field" />
      <input type="hidden" name="subject" />
      <input name="namn" />
      <input name="email" type="email" />
      <input name="telefon" type="tel" />
      <select name="intresse"><option value="grupp">Grupp</option></select>
      <textarea name="meddelande"></textarea>
    </form>
  </body>
</html>
